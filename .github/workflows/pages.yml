# Build the React site and publish it on GitHub Pages (https://rittiporn12.github.io/RoadAware/).
# The site talks to the API given in the link (?api=...), e.g. the presenter's Mac through "Start Demo Server.command".
name: Deploy website to GitHub Pages

on:
  push:
    branches: [main]
    paths: ["frontend/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      # npm install (not npm ci): the lock file predates the optional phone-test plugin, so ci would refuse it
      - run: npm install --no-audit --no-fund
      - run: npm run build
        env:
          ROADAWARE_BASE: /${{ github.event.repository.name }}/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
