  </g>
  <g id="text_23">
   <text style="fill: #8290a0; font: 11.5px 'DejaVu Sans'; text-anchor: start" x="65.52" y="54.72" transform="rotate(-0 65.52 54.72)">Daily HGB, pooled OOF 2022–2023: the model overpredicts before Songkran, and underpredicts during / after it.</text>
  </g>
  <g id="text_24">
   <text style="fill: #56687b; font: 9px 'DejaVu Sans'" transform="translate(65.52 530.068359)">Source: analysis/slices_daily.csv, festival dimension. n = eligible province-day cells, not number of accidents.</text>
   <text style="fill: #56687b; font: 9px 'DejaVu Sans'" transform="translate(65.52 542.448281)">These are descriptive group averages with adequate support; they do not show individual travel risk or a causal festival effect.</text>
  </g>
