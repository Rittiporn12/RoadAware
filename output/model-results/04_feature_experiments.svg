  <g id="text_41">
   <text style="fill: #56687b; font: 9px 'DejaVu Sans'" transform="translate(65.52 530.068359)">Source: models/oof_metrics_pooled.csv. Core and added feature groups use the frozen experiment definitions.</text>
   <text style="fill: #56687b; font: 9px 'DejaVu Sans'" transform="translate(65.52 542.448281)">AADT is a station-based annual proxy, not live traffic. Ablation differences do not establish causal importance or proven weather benefit.</text>
